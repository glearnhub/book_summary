<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Sign in · Book Circle</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-nav"></div>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <ul class="nav nav-pills nav-fill mb-4" id="mode-tabs">
                <li class="nav-item">
                  <button class="nav-link active" type="button" data-mode="signin">Sign in</button>
                </li>
                <li class="nav-item">
                  <button class="nav-link" type="button" data-mode="signup">Create account</button>
                </li>
              </ul>

              <div id="message" class="mb-3"></div>

              <form id="auth-form" novalidate>
                <div class="mb-3 d-none" id="name-group">
                  <label for="display-name" class="form-label">Your name</label>
                  <input
                    id="display-name"
                    class="form-control"
                    type="text"
                    maxlength="50"
                    autocomplete="nickname"
                    placeholder="Shown next to your summaries"
                  />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input id="email" class="form-control" type="email" autocomplete="email" required />
                </div>
                <div class="mb-4">
                  <label for="password" class="form-label">Password</label>
                  <input
                    id="password"
                    class="form-control"
                    type="password"
                    minlength="6"
                    autocomplete="current-password"
                    required
                  />
                  <div class="form-text d-none" id="password-hint">At least 6 characters.</div>
                </div>
                <button id="submit-btn" class="btn btn-primary w-100" type="submit">Sign in</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
