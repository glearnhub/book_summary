<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Submit a summary · Book Circle</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/animations.js"></script>
  </head>
  <body>
    <div id="site-nav"></div>

    <main class="container py-4">
      <div class="row g-4">
        <div class="col-12 col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h4 mb-3" id="form-title">Submit a book summary</h1>
              <div id="message" class="mb-3"></div>
              <form id="summary-form" novalidate>
                <div class="mb-3">
                  <label for="book-title" class="form-label">Book title</label>
                  <input
                    id="book-title"
                    class="form-control"
                    type="text"
                    maxlength="200"
                    list="book-options"
                    required
                  />
                  <datalist id="book-options"></datalist>
                </div>
                <div class="mb-3">
                  <label for="summary" class="form-label">Your summary</label>
                  <div class="d-flex align-items-center gap-2 mb-2">
                    <button id="bold-btn" class="btn btn-outline-secondary btn-sm fw-bold px-3" type="button" title="Bold (Ctrl+B)" aria-label="Bold">B</button>
                    <span class="form-text m-0">Select some text, then click <strong>B</strong> to make it bold, for example a title.</span>
                  </div>
                  <textarea
                    id="summary"
                    class="form-control"
                    rows="10"
                    maxlength="10000"
                    required
                  ></textarea>
                  <div class="form-text text-end"><span id="count">0</span> / 10000</div>
                  <details class="mt-2" id="preview-box">
                    <summary class="small text-muted">See how it will look</summary>
                    <div id="preview" class="summary-text border rounded p-3 mt-2 bg-white"></div>
                  </details>
                </div>
                <button id="submit-btn" class="btn btn-primary" type="submit">Publish summary</button>
                <button id="cancel-btn" class="btn btn-outline-secondary d-none" type="button">
                  Cancel
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-5">
          <h2 class="h5 mb-3">My assigned books</h2>
          <div id="assigned" class="vstack gap-2 mb-4"></div>

          <h2 class="h5 mb-3">My summaries</h2>
          <div id="mine" class="vstack gap-2 mb-4"></div>

          <h2 class="h5 mb-3">Change password</h2>
          <div class="card shadow-sm">
            <div class="card-body">
              <div id="password-message" class="mb-3"></div>
              <form id="password-form" novalidate>
                <div class="mb-3">
                  <label for="new-password" class="form-label">New password</label>
                  <input
                    id="new-password"
                    class="form-control"
                    type="password"
                    minlength="6"
                    autocomplete="new-password"
                  />
                </div>
                <div class="mb-3">
                  <label for="confirm-password" class="form-label">Confirm new password</label>
                  <input
                    id="confirm-password"
                    class="form-control"
                    type="password"
                    minlength="6"
                    autocomplete="new-password"
                  />
                </div>
                <button class="btn btn-outline-primary" type="submit">Update password</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/submit.js"></script>
  </body>
</html>
