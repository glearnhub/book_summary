<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Book Circle</title>
    <meta name="description" content="Weekly book summaries shared by our reading group." />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/animations.js"></script>
  </head>
  <body>
    <div id="site-nav"></div>

    <header class="hero">
      <div class="container">
        <h1 class="display-6 fw-bold mb-2">Weekly book summaries</h1>
        <p class="lead mb-4">One book a week, one summary each. See what everyone has been reading.</p>
        <form id="search-form" class="search-box" role="search">
          <label for="search" class="visually-hidden">Search by book title or member name</label>
          <input
            id="search"
            class="form-control form-control-lg"
            type="search"
            placeholder="Search by book title or member name..."
            autocomplete="off"
          />
        </form>
      </div>
    </header>

    <main class="container py-4">
      <div id="status"></div>
      <div id="feed" class="vstack gap-3"></div>
      <div class="text-center mt-4">
        <button id="load-more" class="btn btn-outline-primary d-none" type="button">Load more</button>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
