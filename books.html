<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Books · Book Circle</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-nav"></div>

    <main class="container py-4">
      <h1 class="h3 mb-1">Books</h1>
      <p class="text-muted mb-4">See which books are still free and which are already assigned.</p>
      <div id="message" class="mb-3"></div>

      <div id="panel" class="row g-4 d-none">
        <section class="col-12 col-lg-6">
          <h2 class="h5 mb-3">Unassigned books <span id="unassigned-count" class="badge text-bg-secondary"></span></h2>
          <div id="unassigned" class="vstack gap-2"></div>
        </section>
        <section class="col-12 col-lg-6">
          <h2 class="h5 mb-3">Assigned books <span id="assigned-count" class="badge text-bg-secondary"></span></h2>
          <div id="assigned" class="vstack gap-2"></div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/books.js"></script>
  </body>
</html>
