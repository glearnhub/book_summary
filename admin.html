<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Admin · Book Circle</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/animations.js"></script>
  </head>
  <body>
    <div id="site-nav"></div>

    <main class="container py-4">
      <h1 class="h3 mb-4">Admin</h1>
      <div id="message" class="mb-3"></div>

      <div id="panel" class="row g-4 d-none">
        <div class="col-12 col-lg-5 vstack gap-4">
          <section class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="h5 mb-3">Add an available book</h2>
              <form id="book-form" novalidate>
                <div class="mb-3">
                  <label for="book-title" class="form-label">Title</label>
                  <input id="book-title" class="form-control" type="text" maxlength="200" required />
                </div>
                <div class="mb-3">
                  <label for="book-author" class="form-label">Author <span class="text-muted">(optional)</span></label>
                  <input id="book-author" class="form-control" type="text" maxlength="100" />
                </div>
                <button class="btn btn-primary" type="submit">Add book</button>
              </form>
            </div>
          </section>

          <section class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="h5 mb-3">Assign a book to a member</h2>
              <form id="assign-form" novalidate>
                <div class="mb-3">
                  <label for="assign-book" class="form-label">Book</label>
                  <select id="assign-book" class="form-select" required></select>
                </div>
                <div class="mb-3">
                  <label for="assign-member" class="form-label">Member</label>
                  <select id="assign-member" class="form-select" required></select>
                </div>
                <div class="mb-3">
                  <label for="assign-due" class="form-label">Due date <span class="text-muted">(optional)</span></label>
                  <input id="assign-due" class="form-control" type="date" />
                </div>
                <button class="btn btn-primary" type="submit">Assign</button>
              </form>
            </div>
          </section>
        </div>

        <div class="col-12 col-lg-7 vstack gap-4">
          <section>
            <h2 class="h5 mb-3">Unassigned books</h2>
            <div id="books" class="vstack gap-2"></div>
          </section>
          <section>
            <h2 class="h5 mb-3">Assigned books</h2>
            <div id="assignments" class="vstack gap-2"></div>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
